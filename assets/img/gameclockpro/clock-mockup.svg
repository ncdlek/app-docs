<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620" role="img" aria-label="Game Clock Pro: two clock faces, one for each player, with Japanese byo-yomi running">
<title>Game Clock Pro clock screen</title>
<defs>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2be7f"/><stop offset="1" stop-color="#cfa462"/></linearGradient>
  <clipPath id="screen"><rect x="14" y="14" width="292" height="592" rx="40"/></clipPath>
</defs>
<rect x="2" y="2" width="316" height="616" rx="52" fill="#11181d"/>
<g clip-path="url(#screen)" font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif">
  <rect x="14" y="14" width="292" height="592" fill="url(#wood)"/>
  <!-- top player (rotated for the opponent across the table) -->
  <g transform="rotate(180 160 165)">
    <rect x="28" y="40" width="264" height="250" rx="26" fill="#fbf3e4" opacity=".55"/>
    <circle cx="160" cy="92" r="14" fill="#141414"/>
    <text x="160" y="190" text-anchor="middle" font-size="68" font-weight="700" fill="#3a2410" letter-spacing="1">08:42</text>
    <text x="160" y="232" text-anchor="middle" font-size="17" fill="#5a3d1c">Main time · 3 × 30s</text>
  </g>
  <!-- controls -->
  <g transform="translate(160 310)">
    <circle r="26" fill="#02253a"/>
    <rect x="-8" y="-10" width="5.5" height="20" rx="2" fill="#fbf3e4"/><rect x="2.5" y="-10" width="5.5" height="20" rx="2" fill="#fbf3e4"/>
    <circle cx="-74" r="18" fill="#02253a" opacity=".85"/>
    <path d="M-81 -2 a8 8 0 1 0 6 -6" fill="none" stroke="#fbf3e4" stroke-width="2.6" stroke-linecap="round"/><path d="M-77 -12 l4 4 -5 2z" fill="#fbf3e4"/>
    <circle cx="74" r="18" fill="#02253a" opacity=".85"/>
    <circle cx="74" r="6.5" fill="none" stroke="#fbf3e4" stroke-width="2.6"/>
  </g>
  <!-- bottom player, running -->
  <rect x="28" y="340" width="264" height="250" rx="26" fill="#f5b94f"/>
  <rect x="28" y="340" width="264" height="250" rx="26" fill="none" stroke="#02253a" stroke-width="4"/>
  <circle cx="160" cy="392" r="14" fill="#ffffff" stroke="#8a7a62"/>
  <text x="160" y="490" text-anchor="middle" font-size="76" font-weight="800" fill="#02253a" letter-spacing="1">00:27</text>
  <text x="160" y="532" text-anchor="middle" font-size="17" font-weight="600" fill="#02253a">Byo-yomi · 2 periods left</text>
  <rect x="80" y="550" width="160" height="8" rx="4" fill="#02253a" opacity=".18"/>
  <rect x="80" y="550" width="144" height="8" rx="4" fill="#02253a"/>
</g>
</svg>
